{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-deployer.postgresqlPasswordSecretName" . }}
  labels:
    {{- include "k8s-deployer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  password: {{ required "postgresql.auth.password is required unless postgresql.auth.existingSecret is set" .Values.postgresql.auth.password | quote }}
{{- end }}
